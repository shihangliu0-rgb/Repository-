# Drop-in workflow: comment a RepoLens report on every pull request,
# upload the interactive dashboard as an artifact, and fail if health drops.
# Copy this file into any repository that has Python available.
name: RepoLens

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  repolens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # RepoLens needs the full history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install RepoLens
        run: python -m pip install -e .

      - name: Analyse
        run: |
          python -m repolens . \
            --html repolens-report.html \
            --json repolens.json \
            --markdown repolens.md \
            --no-color

      - name: Upload dashboard
        uses: actions/upload-artifact@v4
        with:
          name: repolens-report
          path: |
            repolens-report.html
            repolens.json

      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('repolens.md', 'utf8');
            const marker = '<!-- repolens -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            const payload = marker + '\n' + body;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body: payload,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body: payload,
              });
            }

      # Uncomment to enforce a quality gate:
      # - name: Quality gate
      #   run: python -m repolens . --fail-under 60 --no-color
